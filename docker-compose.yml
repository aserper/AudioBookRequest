# AudioBookRequest Docker Compose Configuration
# 
# This configuration supports two database backends through Docker Compose profiles:
#
# 1. SQLite Profile (local development):
#    docker-compose --profile local up
#    - Uses SQLite database stored in ./config/db.sqlite
#    - Lightweight setup for development and testing
#    - Data persisted in ./config volume
#
# 2. PostgreSQL Profile (production):
#    docker-compose --profile postgresql up
#    - Uses PostgreSQL database with persistent storage
#    - Includes health checks and proper startup ordering
#    - Data persisted in postgres_data volume
#    - Database credentials can be customized via environment variables
#
# Services:
# - web: AudioBookRequest application (SQLite mode)
# - web-postgresql: AudioBookRequest application (PostgreSQL mode)
# - postgres: PostgreSQL 16 database server (alpine image)
# - gotify: Notification server (available in both profiles)
#
# Environment Configuration:
# - Copy .env.example to .env to customize database credentials
# - Default PostgreSQL credentials should be changed for production
# - PostgreSQL port 5432 is exposed for external access if needed
# - Use strong passwords and restrict network access in production
#

services:
  # AudioBookRequest web application service for SQLite (local development)
  # Usage: docker-compose --profile local up (maintains backward compatibility)
  web:
    build:
      context: .
      args:
        - VERSION=local
    volumes:
      - ./config:/config
    ports:
      - "8000:8000"
    profiles:
      - local      # SQLite profile (default local development)
    restart: unless-stopped

  # AudioBookRequest web application service for PostgreSQL
  # Usage: docker-compose --profile postgresql up
  web-postgresql:
    build:
      context: .
      args:
        - VERSION=local
    volumes:
      - ./config:/config
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL database configuration
      - ABR_DB__TYPE=postgresql
      - ABR_DB__POSTGRESQL__HOST=postgres
      - ABR_DB__POSTGRESQL__PORT=5432
      - ABR_DB__POSTGRESQL__USER=${POSTGRES_USER:-audiobookrequest}
      - ABR_DB__POSTGRESQL__PASSWORD=${POSTGRES_PASSWORD:-audiobookrequest_password}
      - ABR_DB__POSTGRESQL__DATABASE=${POSTGRES_DB:-audiobookrequest}
    command: /app/.venv/bin/fastapi run --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - postgresql # PostgreSQL profile
    networks:
      - audiobookrequest
    restart: unless-stopped

  # PostgreSQL database service
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-audiobookrequest}
      - POSTGRES_USER=${POSTGRES_USER:-audiobookrequest}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-audiobookrequest_password}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose for external access if needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobookrequest -d audiobookrequest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles:
      - postgresql # PostgreSQL profile only
    networks:
      - audiobookrequest

  # Gotify notification service (works with all profiles)
  gotify:
    image: gotify/server
    ports:
      - "8080:80"
    volumes:
      - ./data/gotify/data:/app/data
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local

# Networks for service communication
networks:
  audiobookrequest:
    driver: bridge
